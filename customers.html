<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - Shamba ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="SHAMBAHUB.png" alt="Shamba Hub"></div>
      <nav>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="users.html">👥 Users</a>
        <a href="operations.html">🔧 Operations</a>
        <a href="production.html">📦 Production</a>
        <a href="finance.html" class="active">💰 Finance</a>
        <a href="reports.html">📥📤 Reports</a>
        <a href="analytics.html">📊 Analytics</a>
        <a href="calendar.html">📅 Calendar</a>
        <a href="notifications.html">📢 Notifications</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Customers</h1>
        <div class="user-info"><span id="userEmail">-</span></div>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>Customer List</h2>
          <button id="addCustomerBtn" class="btn-primary">+ Add Customer</button>
        </div>

        <div id="addCustomerForm" class="form-box" style="display:none;">
          <div class="input-group"><span>👤</span><input type="text" id="custName" placeholder="Full name"></div>
          <div class="input-group"><span>📞</span><input type="text" id="custPhone" placeholder="Phone"></div>
          <div class="input-group"><span>📧</span><input type="email" id="custEmail" placeholder="Email"></div>
          <div class="input-group"><span>📍</span><input type="text" id="custLocation" placeholder="Location"></div>
          <div class="form-actions">
            <button id="saveCustomerBtn" class="btn-primary">Save</button>
            <button id="cancelCustomerBtn" class="btn-secondary">Cancel</button>
          </div>
        </div>

        <table class="data-table">
          <thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Email</th><th>Location</th><th>Actions</th></tr></thead>
          <tbody id="customersTableBody"><tr><td colspan="6">Loading...</td></tr></tbody>
        </table>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
