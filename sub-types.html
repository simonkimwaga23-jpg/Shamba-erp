<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sub-Types - Shamba ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="SHAMBAHUB.png" alt="Shamba Hub"></div>
      <nav>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="users.html">👥 Users</a>
        <a href="operations.html">🔧 Operations</a>
        <a href="production.html" class="active">📦 Production</a>
        <a href="finance.html">💰 Finance</a>
        <a href="reports.html">📥📤 Reports</a>
        <a href="analytics.html">📊 Analytics</a>
        <a href="calendar.html">📅 Calendar</a>
        <a href="notifications.html">📢 Notifications</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Sub-Types</h1>
        <div class="user-info"><span id="userEmail">-</span></div>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>All Sub-Types</h2>
          <button id="addSubTypeBtn" class="btn-primary">+ Add Sub-Type</button>
        </div>

        <div id="addSubTypeForm" class="form-box" style="display:none;">
          <div class="input-group"><span>🐔</span><select id="subCategory"></select></div>
          <div class="input-group"><span>📛</span><input type="text" id="subName" placeholder="Name (e.g. Local, Broiler, Layer)"></div>
          <div class="input-group"><span>🔢</span><input type="number" id="subQuantity" placeholder="Quantity"></div>
          <div class="input-group"><span>📅</span><input type="number" id="subAge" placeholder="Age (days)"></div>
          <div class="input-group"><span>✅</span>
            <select id="subHealth">
              <option value="good">Good</option>
              <option value="average">Average</option>
              <option value="bad">Bad</option>
            </select>
          </div>
          <div class="form-actions">
            <button id="saveSubTypeBtn" class="btn-primary">Save</button>
            <button id="cancelSubTypeBtn" class="btn-secondary">Cancel</button>
          </div>
        </div>

        <table class="data-table">
          <thead><tr><th>#</th><th>Name</th><th>Category</th><th>Quantity</th><th>Age</th><th>Health</th><th>Actions</th></tr></thead>
          <tbody id="subTypesTableBody"><tr><td colspan="7">Loading...</td></tr></tbody>
        </table>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
