<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnings - Shamba ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="SHAMBAHUB.png" alt="Shamba Hub"></div>
      <nav>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="users.html">👥 Users</a>
        <a href="operations.html" class="active">🔧 Operations</a>
        <a href="production.html">📦 Production</a>
        <a href="finance.html">💰 Finance</a>
        <a href="reports.html">📥📤 Reports</a>
        <a href="analytics.html">📊 Analytics</a>
        <a href="calendar.html">📅 Calendar</a>
        <a href="notifications.html">📢 Notifications</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Turning Logs</h1>
        <div class="user-info"><span id="userEmail">-</span></div>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>All Turning Records</h2>
          <button id="addTurningBtn" class="btn-primary">+ Add Turning</button>
        </div>

        <div id="addTurningForm" class="form-box" style="display:none;">
          <div class="input-group"><span>📦</span><select id="turnBatch"></select></div>
          <div class="input-group"><span>🔢</span><input type="number" id="turnCount" placeholder="Turning count"></div>
          <div class="input-group"><span>🌡️</span><input type="number" step="0.1" id="turnTemp" placeholder="Temp (°C)"></div>
          <div class="input-group"><span>💧</span><input type="number" id="turnHumidity" placeholder="Humidity (%)"></div>
          <div class="form-actions">
            <button id="saveTurningBtn" class="btn-primary">Save</button>
            <button id="cancelTurningBtn" class="btn-secondary">Cancel</button>
          </div>
        </div>

        <table class="data-table">
          <thead><tr><th>#</th><th>Date</th><th>Batch</th><th>Turns</th><th>Temp</th><th>Humidity</th></tr></thead>
          <tbody id="turningsTableBody"><tr><td colspan="6">Loading...</td></tr></tbody>
        </table>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
