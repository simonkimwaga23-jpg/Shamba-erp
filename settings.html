<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Shamba ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="SHAMBAHUB.png" alt="Shamba Hub"></div>
      <nav>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="users.html">👥 Users</a>
        <a href="operations.html">🔧 Operations</a>
        <a href="production.html">📦 Production</a>
        <a href="finance.html">💰 Finance</a>
        <a href="reports.html">📥📤 Reports</a>
        <a href="analytics.html">📊 Analytics</a>
        <a href="calendar.html">📅 Calendar</a>
        <a href="notifications.html">📢 Notifications</a>
        <a href="settings.html" class="active">⚙️ Settings</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Settings</h1>
        <div class="user-info"><span id="userEmail">-</span></div>
      </header>

      <div class="tabs">
        <button class="tab active" data-tab="profile">👤 Profile</button>
        <button class="tab" data-tab="farm">🏡 Farm Info</button>
        <button class="tab" data-tab="notifications">🔔 Notifications</button>
      </div>

      <!-- PROFILE -->
      <section class="panel tab-content" id="tab-profile">
        <h2>Profile</h2>
        <div class="form-box" style="margin-top: 20px;">
          <div class="input-group"><span>👤</span><input type="text" id="profileName" placeholder="Full Name"></div>
          <div class="input-group"><span>📧</span><input type="email" id="profileEmail" placeholder="Email" disabled></div>
          <div class="form-actions">
            <button id="saveProfileBtn" class="btn-primary">Save Profile</button>
          </div>
        </div>
      </section>

      <!-- FARM INFO -->
      <section class="panel tab-content" id="tab-farm" style="display:none;">
        <h2>Farm Information</h2>
        <div class="form-box" style="margin-top: 20px;">
          <div class="input-group"><span>🏡</span><input type="text" id="farmName" placeholder="Farm Name"></div>
          <div class="input-group"><span>📍</span><input type="text" id="farmLocation" placeholder="Location"></div>
          <div class="input-group"><span>📞</span><input type="text" id="farmPhone" placeholder="Phone"></div>
          <div class="form-actions">
            <button id="saveFarmBtn" class="btn-primary">Save Farm Info</button>
          </div>
        </div>
      </section>

      <!-- NOTIFICATIONS -->
      <section class="panel tab-content" id="tab-notifications" style="display:none;">
        <h2>Notifications</h2>
        <div class="form-box" style="margin-top: 20px;">
          <div class="checkbox-row"><label><input type="checkbox" id="notifTurning" checked> Turning reminders</label></div>
          <div class="checkbox-row"><label><input type="checkbox" id="notifFeed" checked> Feed alerts</label></div>
          <div class="checkbox-row"><label><input type="checkbox" id="notifHealth" checked> Health alerts</label></div>
          <div class="checkbox-row"><label><input type="checkbox" id="notifHatch" checked> Hatch notifications</label></div>
          <div class="form-actions">
            <button id="saveNotifBtn" class="btn-primary">Save Notifications</button>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
