<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candling - Shamba ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span>🐔</span><h2>SHAMBA ERP</h2></div>
      <nav>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="users.html">👥 Users</a>
        <a href="operations.html" class="active">🔧 Operations</a>
        <a href="production.html">📦 Production</a>
        <a href="finance.html">💰 Finance</a>
        <a href="reports.html">📥📤 Reports</a>
        <a href="analytics.html">📊 Analytics</a>
        <a href="calendar.html">📅 Calendar</a>
        <a href="notifications.html">📢 Notifications</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Candling Results</h1>
        <div class="user-info"><span id="userEmail">-</span></div>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>All Candling Records</h2>
          <button id="addCandleBtn" class="btn-primary">+ Add Candling</button>
        </div>

        <div id="addCandleForm" class="form-box" style="display:none;">
          <div class="input-group"><span>📦</span><select id="candleBatch"></select></div>
          <div class="input-group"><span>📅</span>
            <select id="candleDay"><option value="7">Day 7</option><option value="14">Day 14</option></select>
          </div>
          <div class="input-group"><span>✅</span><input type="number" id="candleFertile" placeholder="Fertile"></div>
          <div class="input-group"><span>❌</span><input type="number" id="candleInfertile" placeholder="Infertile"></div>
          <div class="form-actions">
            <button id="saveCandleBtn" class="btn-primary">Save</button>
            <button id="cancelCandleBtn" class="btn-secondary">Cancel</button>
          </div>
        </div>

        <table class="data-table">
          <thead><tr><th>#</th><th>Date</th><th>Batch</th><th>Day</th><th>Fertile</th><th>Infertile</th><th>Rate</th></tr></thead>
          <tbody id="candlingTableBody"><tr><td colspan="7">Loading...</td></tr></tbody>
        </table>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
