<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assets - Shamba ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span>🐔</span><h2>SHAMBA ERP</h2></div>
      <nav>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="users.html">👥 Users</a>
        <a href="operations.html" class="active">🔧 Operations</a>
        <a href="production.html">📦 Production</a>
        <a href="finance.html">💰 Finance</a>
        <a href="reports.html">📥📤 Reports</a>
        <a href="analytics.html">📊 Analytics</a>
        <a href="calendar.html">📅 Calendar</a>
        <a href="notifications.html">📢 Notifications</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Assets</h1>
        <div class="user-info"><span id="userEmail">-</span></div>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>All Assets</h2>
          <button id="addAssetBtn" class="btn-primary">+ Add Asset</button>
        </div>

        <div id="addAssetForm" class="form-box" style="display:none;">
          <div class="input-group"><span>📛</span><input type="text" id="assetName" placeholder="Name"></div>
          <div class="input-group"><span>🎭</span>
            <select id="assetType">
              <option value="incubator">Incubator</option>
              <option value="machine">Machine</option>
              <option value="pump">Water Pump</option>
              <option value="generator">Generator</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="input-group"><span>💰</span><input type="number" id="assetCost" placeholder="Purchase cost"></div>
          <div class="input-group"><span>📅</span><input type="date" id="assetDate"></div>
          <div class="input-group"><span>⏳</span><input type="number" id="assetDurability" placeholder="Durability (years)"></div>
          <div class="form-actions">
            <button id="saveAssetBtn" class="btn-primary">Save</button>
            <button id="cancelAssetBtn" class="btn-secondary">Cancel</button>
          </div>
        </div>

        <table class="data-table">
          <thead><tr><th>#</th><th>Name</th><th>Type</th><th>Cost</th><th>Date</th><th>Durability</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="assetsTableBody"><tr><td colspan="8">Loading...</td></tr></tbody>
        </table>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
