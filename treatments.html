<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treatments - Shamba ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span>🐔</span><h2>SHAMBA ERP</h2></div>
      <nav>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="users.html">👥 Users</a>
        <a href="operations.html">🔧 Operations</a>
        <a href="production.html" class="active">📦 Production</a>
        <a href="finance.html">💰 Finance</a>
        <a href="reports.html">📥📤 Reports</a>
        <a href="analytics.html">📊 Analytics</a>
        <a href="calendar.html">📅 Calendar</a>
        <a href="notifications.html">📢 Notifications</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Treatments</h1>
        <div class="user-info"><span id="userEmail">-</span></div>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>Treatment Records</h2>
          <button id="addTreatmentBtn" class="btn-primary">+ Add Treatment</button>
        </div>

        <div id="addTreatmentForm" class="form-box" style="display:none;">
          <h3>Add Treatment</h3>
          <div class="input-group"><span>🦠</span><input type="text" id="treatDisease" placeholder="Disease / reason"></div>
          <div class="input-group"><span>💊</span><input type="text" id="treatMedicine" placeholder="Medicine used"></div>
          <div class="input-group"><span>📏</span><input type="text" id="treatDosage" placeholder="Dosage"></div>
          <div class="input-group"><span>💰</span><input type="number" id="treatCost" placeholder="Cost (TZS)"></div>
          <div class="input-group"><span>📅</span><input type="date" id="treatDate"></div>
          <div class="form-actions">
            <button id="saveTreatmentBtn" class="btn-primary">Save</button>
            <button id="cancelTreatmentBtn" class="btn-secondary">Cancel</button>
          </div>
        </div>

        <table class="data-table">
          <thead><tr><th>#</th><th>Date</th><th>Disease</th><th>Medicine</th><th>Dosage</th><th>Cost</th><th>Actions</th></tr></thead>
          <tbody id="treatmentsTableBody"><tr><td colspan="7">Loading...</td></tr></tbody>
        </table>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
