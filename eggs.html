<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egg Production - Shamba ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span>🐔</span><h2>SHAMBA ERP</h2></div>
      <nav>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="users.html">👥 Users</a>
        <a href="operations.html">🔧 Operations</a>
        <a href="production.html" class="active">📦 Production</a>
        <a href="finance.html">💰 Finance</a>
        <a href="reports.html">📥📤 Reports</a>
        <a href="analytics.html">📊 Analytics</a>
        <a href="calendar.html">📅 Calendar</a>
        <a href="notifications.html">📢 Notifications</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Egg Production</h1>
        <div class="user-info"><span id="userEmail">-</span></div>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>Egg Records</h2>
          <button id="addEggBtn" class="btn-primary">+ Add Record</button>
        </div>

        <div id="addEggForm" class="form-box" style="display:none;">
          <div class="input-group"><span>🐔</span><select id="eggCategory"></select></div>
          <div class="input-group"><span>📅</span><input type="date" id="eggDate"></div>
          <div class="input-group"><span>🥚</span><input type="number" id="eggCount" placeholder="Eggs collected"></div>
          <div class="input-group"><span>💔</span><input type="number" id="eggBroken" placeholder="Broken eggs"></div>
          <div class="form-actions">
            <button id="saveEggBtn" class="btn-primary">Save</button>
            <button id="cancelEggBtn" class="btn-secondary">Cancel</button>
          </div>
        </div>

        <table class="data-table">
          <thead><tr><th>#</th><th>Date</th><th>Category</th><th>Eggs</th><th>Broken</th><th>Good</th><th>Actions</th></tr></thead>
          <tbody id="eggsTableBody"><tr><td colspan="7">Loading...</td></tr></tbody>
        </table>
      </section>

      <section class="panel" style="margin-top: 20px;">
        <h2>Trend</h2>
        <div class="kpi-grid" style="margin-top: 20px;">
          <div class="kpi-card"><h3>🥚 Today</h3><p id="eggsToday">0</p></div>
          <div class="kpi-card"><h3>📅 Week</h3><p id="eggsWeek">0</p></div>
          <div class="kpi-card"><h3>📆 Month</h3><p id="eggsMonth">0</p></div>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
