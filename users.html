<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Shamba ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="SHAMBAHUB.png" alt="Shamba Hub"></div>
      <nav>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="users.html" class="active">👥 Users</a>
        <a href="operations.html">🔧 Operations</a>
        <a href="production.html">📦 Production</a>
        <a href="finance.html">💰 Finance</a>
        <a href="reports.html">📥📤 Reports</a>
        <a href="analytics.html">📊 Analytics</a>
        <a href="calendar.html">📅 Calendar</a>
        <a href="notifications.html">📢 Notifications</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1>Users</h1>
        <div class="user-info">
          <span id="userEmail">-</span>
        </div>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>All Users</h2>
          <button id="addUserBtn" class="btn-primary">+ Add User</button>
        </div>

        <div id="addUserForm" class="form-box" style="display:none;">
          <h3>Add New User</h3>
          <div class="input-group"><span>👤</span><input type="text" id="newName" placeholder="Full Name" required></div>
          <div class="input-group"><span>📧</span><input type="email" id="newEmail" placeholder="Email" required></div>
          <div class="input-group"><span>🔒</span><input type="password" id="newPassword" placeholder="Password" required></div>
          <div class="input-group"><span>🎭</span>
            <select id="newRole">
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-actions">
            <button id="saveUserBtn" class="btn-primary">Save</button>
            <button id="cancelUserBtn" class="btn-secondary">Cancel</button>
          </div>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="6">Loading...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
